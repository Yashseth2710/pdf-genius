[project]
name = "pdf-genius-backend"
version = "0.1.0"
description = "Everything PDF. One simple workspace."
requires-python = ">=3.12"

# What the deployed function needs, and nothing else.
#
# Deliberately not requirements.lock.txt: that file is the development and CI
# environment, pytest and ruff and mypy included, and installing it produced a
# 259MB bundle against a 225MB ceiling. What is missing from the list below is
# as considered as what is in it:
#
#   uvicorn   runs the app locally; the platform provides the ASGI server
#   alembic   migrations are run from a developer machine, never from a request
#   pypdf     not imported anywhere
#   pdfplumber  likewise, and it drags in pdfminer, cryptography and pypdfium2
#
# Pinned to the same versions as the lock file, so what runs in production is
# what the tests ran against. Adding a runtime import means adding it here too.
dependencies = [
    "fastapi==0.141.1",
    "python-multipart==0.0.32",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "SQLAlchemy==2.0.51",
    "psycopg[binary]==3.3.4",
    "PyJWT==2.13.0",
    "argon2-cffi==25.1.0",
    "pymupdf==1.28.2",
    "pillow==12.3.0",
    "pillow-heif==1.5.0",
    "slowapi==0.1.10",
    "redis==8.1.0",
    "httpx==0.28.1",
]

[tool.vercel]
# Vercel would find `app/main.py` on its own - it is one of the entrypoints it
# looks for, and it exports `app`. Naming it anyway means a future rename of
# that module fails the deploy with a clear error instead of a 404 on every
# route.
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "S",    # bandit security checks
    "ASYNC",
    "SIM",  # simplify
    "PTH",  # prefer pathlib
    "RUF",
]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the documented pattern
]

[tool.ruff.lint.isort]
# Stated explicitly rather than inferred. Ruff guesses first-party packages
# from the working directory, so the same file could be sorted two different
# ways depending on where the command was run from - or which version ran it.
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert and hard-coded dummy secrets.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
exclude = ["\\.venv", "migrations/versions"]

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = ["slowapi.*", "pdfplumber.*", "fitz.*", "pymupdf.*", "pillow_heif.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF ships partial annotations: its classes are untyped, so strict mode
# rejects every call. Allow untyped calls in the modules that use it rather
# than dropping strictness across the whole codebase.
module = [
    "app.services.files.service",
    "app.services.pdf.*",
    # The tests build real PDFs to work on, so they call the same untyped API.
    "tests.test_pdf_operations",
    "tests.test_pdf_compress",
    "tests.test_pdf_images",
    "tests.integration.test_documents_api",
    "tests.integration.test_direct_upload_api",
    "tests.integration.test_tools_api",
]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Put backend/ on sys.path so "import app" works whether the suite is started
# as `pytest` or as `python -m pytest` (only the latter adds the working
# directory automatically).
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:app.*"]
